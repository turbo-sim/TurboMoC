[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo_moc"
version = "1.2.1"
description = "Method of Characteristics solvers for two-phase and single-phase nozzle/stator design (minimum-length and conventional/arc-flashing variants)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
    "jaxprop>=0.5.6",
    "numpy",
    "scipy",
    "matplotlib",
    "gmsh>=4.12,<5.0",
    "pyvista>=0.46,<1.0",
    "dash-vtk>=0.0.9,<1.0",
    "PyYAML>=6.0,<7.0",
    "pandas",
    "plotly",
    "kaleido>=1",
    "dash[diskcache]>=2.16",
]

[project.optional-dependencies]
# Optional STEP export support. CadQuery may instead be installed through the
# Conda environment defined in environment.yaml.
cad = ["cadquery"]
# Fluent automation is opt-in: poetry install -E fluent / pip install .[fluent].
# Install the companion barotropy checkout separately for fluid-model generation.
fluent = ["ansys-fluent-core[reader]>=0.38,<0.43"]

[project.scripts]
turbo_moc-app-legacy = "turbo_moc.legacy.app:main"
turbo_moc-app = "turbo_moc.app:main"

[tool.poetry.group.dev.dependencies]
bibtexparser = ">=1.4,<2"
linkify-it-py = ">=2,<3"
myst-parser = ">=3,<4"
numpydoc = ">=1.7,<2"
pyzotero = ">=1.5,<2"
pytest = ">=8.3,<9"
sphinx = ">=7.3,<8"
sphinx-autobuild = ">=2024.0"
sphinx-book-theme = ">=1.1,<2"
sphinx-design = ">=0.6,<1"
sphinx-togglebutton = ">=0.3,<1"
sphinxcontrib-bibtex = ">=2.6,<3"
bump-my-version = "^1.5.1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"turbo_moc.app" = ["assets/*.js", "assets/*.css", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# Fluent and legacy checks are opt-in via pytest tests/fluent or tests/deprecated.
norecursedirs = ["deprecated", "fluent"]


# Version bumping and releasing (run from the repository root):
# 1. Install development tools: poetry install --with dev
# 2. Commit your changes first; bumping requires a clean working tree.
# 3. Preview a bump: poetry run bump-my-version bump --dry-run --verbose patch
# 4. Choose ONE increment (updates version files, commits, and creates a vX.Y.Z tag):
#    poetry run bump-my-version bump patch
#    poetry run bump-my-version bump minor
#    poetry run bump-my-version bump major
# 5. Release from main: git push origin main --follow-tags
#    GitHub Actions builds the distributions and publishes the pushed release tag.
# One-time PyPI setup: https://pypi.org/manage/project/turbo-moc/settings/publishing/
# Add a GitHub Trusted Publisher: owner=turbo-sim, repository=TurboMoC,
# workflow=publish_to_pipy.yml, environment=pypi (must match the workflow).
# Publishing uses GitHub OIDC; no PyPI username/password or API-token secret is needed.
