[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo_moc"
version = "1.0.1"
description = "Method of Characteristics solvers for two-phase and single-phase nozzle/stator design (minimum-length and conventional/arc-flashing variants)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
    "jaxprop>=0.5.6",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "plotly",
    "kaleido>=1",
    "dash[diskcache]",
]

[project.optional-dependencies]
# Optional STEP export support. CadQuery may instead be installed through the
# Conda environment defined in environment.yaml.
cad = ["cadquery"]

[project.scripts]
turbo_moc-app = "turbo_moc.app:main"

[tool.poetry.group.dev.dependencies]
bibtexparser = ">=1.4,<2"
linkify-it-py = ">=2,<3"
myst-parser = ">=3,<4"
numpydoc = ">=1.7,<2"
pyzotero = ">=1.5,<2"
pytest = ">=8.3,<9"
sphinx = ">=7.3,<8"
sphinx-autobuild = ">=2024.0"
sphinx-book-theme = ">=1.1,<2"
sphinx-design = ">=0.6,<1"
sphinx-togglebutton = ">=0.3,<1"
sphinxcontrib-bibtex = ">=2.6,<3"
bump-my-version = "^1.5.1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"


# Rememeber to add --tags when publishing a new version
# git push origin main --tags

# Commands to update versioning
# poetry run bump-my-version bump patch
# poetry run bump-my-version bump minor
# poetry run bump-my-version bump major
