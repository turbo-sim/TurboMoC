# Planning project: rotor geometry/meshing integration is not implemented.
# Parametrization choices are conventional or vortex; neither fabricates a blade.
# Rotor axial_interspace_mm sets the minimum upstream TE-to-rotor LE gap in paired axial mode.
# It defaults to 0 mm and is inactive in rotor-only mode; row meshes remain independent.
machine:
  design_mode: rotor
  geometry_type: axial
workflow:
  save_figures: true
  show_gmsh: true
  show_pyvista: true
  log_level: INFO
rows:
- id: rotor_1
  role: rotor
  geometry:
    parametrization_type: conventional
    meridional_channel:
      type: axial
      hub_radius: 100.0
      blade_height: 10.0
      hub_chord: 20.0
      tip_chord: 20.0
      num_blades: 31
    axial_interspace_mm: 0.0
  mesh:
    show_gui: false
    numerics:
      terminal_output: true
      verbosity: 2
      blade_size: 0.25
      domain_size: 1.0
      curvature_elements: 50
      algorithm: 8
      recombine: true
      recombination_algorithm: 1
      smoothing_steps: 5
      inflation_layers:
        enabled: true
        first_height: 0.03
        growth_ratio: 1.2
        thickness: 1.0
      span_layers: 25
      span_stretch: 1.5
    matplotlib:
      num_blades: 3
      annotate_boundaries: true
      mesh_color: orange
      edge_color: black
      domain_color: lightgrey
      dpi: 500
      rasterize_mesh: true
    visualization:
      section_edge_width: 0.35
      volume_edge_width: 0.35
    pyvista:
      show_mesh_edges: true
      surfaces:
        blade: true
        hub: true
        shroud: false
        inlet: false
        outlet: false
        periodic_left: false
        periodic_right: false
    cgns:
      enabled: true
      filename: rotor_mesh_3d.cgns
      length_scale: 0.001
      boundary_types:
        blade: BCWallViscous
        inlet: BCInflowSubsonic
        outlet: BCOutflowSubsonic
        periodic_left: BCGeneral
        periodic_right: BCGeneral
        hub: BCWallViscous
        shroud: BCWallViscous
