name: Build, test, and publish TurboMoC to PyPI

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check package and release versions
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          tree = ast.parse(Path('src/turbo_moc/__init__.py').read_text())
          package_version = next(
              ast.literal_eval(node.value) for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets)
          )
          if package_version != version:
              raise SystemExit('Package __version__ must match pyproject.toml')
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              expected = f'v{version}'
              if os.environ['GITHUB_REF_NAME'] != expected:
                  raise SystemExit(f'Release tag must be {expected}')
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Install built wheel and test tools
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          wheel, = Path('dist').glob('*.whl')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel), 'pytest>=8.3,<9'])
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run package and app smoke tests
        run: python tests/run_tests.py

  publish_to_pypi:
    needs: [build, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/turbo-moc/
    permissions:
      id-token: write
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish tested distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
