# Conda environment for moc. Conda provides the Python runtime and CadQuery;
# Poetry installs moc and all other dependencies declared in pyproject.toml.
# Run these commands from the repository root:
#   conda env create -f environment.yaml
#   conda activate moc_env
#   poetry install
name: moc_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - cadquery
