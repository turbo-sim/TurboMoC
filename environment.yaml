# Conda environment for TurboMoC. Conda provides the Python runtime and CadQuery;
# Poetry installs TurboMoC and all other dependencies declared in pyproject.toml.
# Run these commands from the repository root:
#   conda env create -f environment.yaml
#   conda activate turbo_moc_env
#   poetry install
name: turbo_moc_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - cadquery
