# App project plus Fluent automation settings (no external design_file needed).
# Linear cascade: distances in the reference plane are physical mm.
# Scale the source blade and its pitch together to meet meridional_chord.
# No physical blade count or radius is needed. Display copies are translated.
# span_layers: 1 produces an optional one-element 3D extrusion.
# True 2D export is also available without generating the volume.
machine:
  design_mode: stator
  geometry_type: linear
  fluid_name: Cyclopentane
workflow:
  save_figures: true
  show_gmsh: true
  show_pyvista: true
  log_level: INFO
rows:
- id: stator_1
  role: stator
  geometry:
    method_of_characteristics:
      inlet_property_pair: PQ_INPUTS
      inlet_property_1: 251300.0  # Stagnation pressure [Pa]
      inlet_property_2: 0.025  # Vapor quality [kg/kg]
      p_back: 95000.0
      solver: conventional
      use_true_sauer_line: true
      y_t: 0.01
      n: 15
      rho_t: 0.2
      rho_d: 0.1
      delta_flow: 0.0
      tau_max: 90.0
      tau_step: 1.0
    meridional_channel:
      type: linear
      meridional_chord: 20.0
      blade_height: 10.0
    blade_geometry:
      metal_angle_in: 0.0
      metal_angle_out: 65.0
      r_trailing: 0.5
      inlet_opening_ratio: 1.3
      n_cp: 30
      num_baseline_points: 500
      num_curve_points: 500
    flow_domain:
      domain_shift_mode: auto
      domain_shift_value: 0.0  # Manual pitchwise shift / pitch [-]; ignored in auto mode
      number_of_points: 120  # Curve samples, not mesh nodes
      inlet:
        extension_type: bspline  # bspline or straight; tangent handles apply only to bspline
        extension_length: 1.5  # Extension distance / reference chord [-]
        axial_tangent: 0.35
        blade_tangent: 0.35
      outlet:
        extension_type: straight  # bspline or straight; tangent handles apply only to bspline
        extension_length: 2.0  # Extension distance / reference chord [-]
        axial_tangent: 0.55
        blade_tangent: 0.15
  mesh:
    show_gui: false
    numerics:
      terminal_output: true
      verbosity: 2
      blade_size: 0.25
      domain_size: 1.0
      curvature_elements: 50
      algorithm: 8
      recombine: true
      recombination_algorithm: 1
      recombine_minimum_quality: 0.1
      smoothing_steps: 5
      inflation_layers:
        enabled: true
        first_height: 0.03
        growth_ratio: 1.2
        thickness: 1.0
      span_layers: 8
      span_stretch: 0.0
    matplotlib:
      num_blades: 3
      annotate_boundaries: true
      mesh_color: orange
      edge_color: black
      domain_color: lightgrey
      dpi: 500
      rasterize_mesh: true
    visualization:
      section_edge_width: 0.35
      volume_edge_width: 0.35
    pyvista:
      show_mesh_edges: true
      surfaces:
        blade: true
        hub: true
        shroud: false
        inlet: false
        outlet: false
        periodic_left: false
        periodic_right: false
    cgns:
      enabled: true
      filename: linear_cascade_3d.cgns
      length_scale: 0.001
      boundary_types:
        blade: BCWallViscous
        inlet: BCInflowSubsonic
        outlet: BCOutflowSubsonic
        periodic_left: BCGeneral
        periodic_right: BCGeneral
        hub: BCWallViscous
        shroud: BCWallViscous

# Fluent-only settings. Preserve these when replacing machine/workflow/rows.
row_id: stator_1  # Active stationary row to solve
output_dir: output
geometry_figure:
  save: true
  show: false                # Open Matplotlib; close it to continue
  size: [14, 8]              # Width and height [inches]
  dpi: 180
  formats: [.png, .svg]
show_gmsh: false              # Optional mesh inspection before Fluent setup
prepare_only: false          # true: generate mesh/model and skip Fluent
run_case: true               # false: create the configured case without initializing or solving

reporting:
  level: INFO               # DEBUG adds detailed diagnostics; WARNING shows only warnings/errors
  filename: workflow.log    # Console messages are also saved here, under output_dir; replaced each run

barotropic:
  # MoC uses equilibrium properties along an isentrope: efficiency = 1.
  calculation_type: equilibrium
  efficiency: 1.0
  # Independent barotropic range: p_out = inlet pressure / pressure_ratio.
  # Fluent outlet pressure still comes from the selected row's method_of_characteristics.p_back.
  pressure_ratio: 8.0
  polynomial_degree: 8
  ODE_solver: LSODA
  ODE_tolerance: 1.0e-9
  save_figures: true

fluent:
  product_version: "24.2"     # Installed Fluent 2024 R2; null selects the newest installation
  processor_count: 4
  start_timeout: 90
  ui_mode: hidden_gui
  case_filename: stator_fluent.cas.h5
  material_name: barotropic_fluid
  turbulence_intensity: 0.05  # Fraction, not percent
  turbulence_viscosity_ratio: 10.0
  # Hybrid initialization runs once before the first solution stage.
  density_relaxation: 1.0    # Keep density consistent with the pressure-dependent material
  turbulence_relaxation: 0.5
  # Each block stops at the residual tolerances or its iteration limit, then advances.
  # Pressure/property and mass-balance reports run only after the final block.
  # order: first or second changes pressure, density, momentum, k and omega together.
  solution_strategy:
    - {iterations: 200, time_scale_factor: 0.5, order: first}
    - {iterations: 200, time_scale_factor: 1.0, order: first}
    - {iterations: 200, time_scale_factor: 2.0, order: first}
    - {iterations: 200, time_scale_factor: 4.0, order: first}
    - {iterations: 200, time_scale_factor: 1.0, order: second}
    - {iterations: 1000, time_scale_factor: 3.0, order: second}
  high_order_relaxation_factor: 0.25  # HOTR is enabled for all flow variables
  # Absolute convergence criteria for the normalized residuals.
  residual_equations:
    continuity: 1.0e-6
    x-velocity: 1.0e-6
    y-velocity: 1.0e-6
    k: 1.0e-6
    omega: 1.0e-6
  residual_figure_dpi: 160    # Resolution of residuals.png
  plot_residuals: true         # Use barotropy.plot_residuals() to save residuals.png
  print_transcript: true      # Stream Fluent's convergence table to the terminal
  pressure_contour:
    enabled: true
    filename: contour_pressure.png
    width: 1600
    height: 1000
  mach_contour:
    enabled: true
    filename: contour_mach.png
    width: 1600
    height: 1000
  periodic_instancing:
    enabled: true
    repeats: 3                # Fluent's Number of Repeats: three blade instances
  boundaries:                # Mesh-zone names; unique CGNS prefixes are detected automatically
    inlet: inlet
    outlet: outlet
    blade: blade
    periodic_left: periodic_left
    periodic_right: periodic_right
