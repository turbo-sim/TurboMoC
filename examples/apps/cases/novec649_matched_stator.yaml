# Novec649 linear stator matched to Downloads/control_points.json (30 CPs, max error < 0.05 mm).
# Conditions from 04_cfd_automation/config.yaml: P0 10.9 bar, x0 0.42, p_back 1.909 bar.
# MoC inputs untouched (y_t default 0.01); blade params pinned on the locked TE points 0,1,28,29; points 2-27 moved with
# control_point_displacements ([dx, dy] / chord). meridional_chord keeps the blade at 1:1 scale.
machine:
  design_mode: stator
  geometry_type: linear
  fluid_name: Novec649
workflow:
  save_figures: true
  show_gmsh: true
  show_pyvista: true
  log_level: INFO
rows:
- id: stator_1
  role: stator
  geometry:
    method_of_characteristics:
      inlet_property_pair: PQ_INPUTS
      inlet_property_1: 1090000.0
      inlet_property_2: 0.42
      p_back: 190900.0
      solver: conventional
      use_true_sauer_line: true
      y_t: 0.01
      n: 15
      rho_t: 0.2
      rho_d: 0.1
      delta_flow: 0.0
      tau_max: 90.0
      tau_step: 1.0
    meridional_channel:
      type: linear
      meridional_chord: 106.5989
      blade_height: 10.0
    blade_geometry:
      metal_angle_in: 50.5716
      metal_angle_out: 70.42
      r_trailing: 0.508
      inlet_opening_ratio: 1.8915
      n_cp: 30
      num_baseline_points: 500
      num_curve_points: 500
      control_point_displacements:
        2:
        - 0.0003714
        - 0.0003775
        3:
        - 0.0008317
