    flow_domain:
      domain_shift_mode: auto
      domain_shift_value: 0.0
      number_of_points: 120
      inlet:
        extension_type: bspline
        extension_length: 1.5
        axial_tangent: 0.35
        blade_tangent: 0.35
      outlet:
        extension_type: straight
        extension_length: 2.0
        axial_tangent: 0.55
        blade_tangent: 0.15
  mesh:
    show_gui: false
    numerics:
      terminal_output: true
      verbosity: 2
      blade_size: 0.25
      domain_size: 1.0
      curvature_elements: 50
      algorithm: 8
      recombine: true
      recombination_algorithm: 1
      recombine_minimum_quality: 0.1
      smoothing_steps: 5
      inflation_layers:
        enabled: true
        first_height: 0.03
        growth_ratio: 1.2
        thickness: 1.0
      span_layers: 8
      span_stretch: 0.0
    matplotlib:
      num_blades: 3
      annotate_boundaries: true
      mesh_color: orange
      edge_color: black
      domain_color: lightgrey
      dpi: 500
      rasterize_mesh: true
    visualization:
      section_edge_width: 0.35
      volume_edge_width: 0.35
    pyvista:
      show_mesh_edges: true
      surfaces:
        blade: true
        hub: true
        shroud: false
        inlet: false
        outlet: false
        periodic_left: false
        periodic_right: false
    cgns:
      enabled: true
      filename: linear_cascade_3d.cgns
      length_scale: 0.001
      boundary_types:
        blade: BCWallViscous
        inlet: BCInflowSubsonic
        outlet: BCOutflowSubsonic
        periodic_left: BCGeneral
        periodic_right: BCGeneral
        hub: BCWallViscous
        shroud: BCWallViscous
