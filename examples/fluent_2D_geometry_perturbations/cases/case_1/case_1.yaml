machine:
  design_mode: stator
  geometry_type: linear
  fluid_name: Cyclopentane
workflow:
  save_figures: true
  show_gmsh: true
  show_pyvista: true
  log_level: INFO
rows:
- id: stator_1
  role: stator
  geometry:
    method_of_characteristics:
      inlet_property_pair: PQ_INPUTS
      inlet_property_1: 251300.0
      inlet_property_2: 0.025
      p_back: 95000.0
      solver: conventional
      use_true_sauer_line: true
      y_t: 0.01
      n: 15
      rho_t: 0.2
      rho_d: 0.1
      delta_flow: 0.0
      tau_max: 90.0
      tau_step: 1.0
    meridional_channel:
      type: linear
      meridional_chord: 20.0
      blade_height: 10.0
    blade_geometry:
      metal_angle_in: 0.0
      metal_angle_out: 65.0
      r_trailing: 0.5
      inlet_opening_ratio: 1.3
      n_cp: 30
      num_baseline_points: 500
      num_curve_points: 500
      geometry_uncertainty:
        Xi:
        - 1.814452571729199
        - -0.4782068360256623
        - -0.109290919821088
        - 0.5230815980385289
        - -0.31328872960146675
        - 0.006803501234722302
        - 1.7569771339969886
        - 1.2008540177280322
        - 0.6489100200082746
        - 0.0037353055838503495
        - 0.11792765955817501
        - 1.5886097926499458
        - 0.05658219481888938
        - 0.6362590939569572
        - 0.6433106759272709
        - -0.6027104764425977
        - 1.3340758540824735
        - -0.7983688704063043
        - 0.13768619764306997
        - -2.357491762863048
        sigma0: 0.8
        sigma1: 0.2
        cp_te_pressure: 0.001
        cp_te_suction: 0.999
        L0: 0.1
        L_le: 0.01
        omega: 0.1
        energy_threshold: 0.99
        n_quad: 500
    flow_domain:
      domain_shift_mode: auto
      domain_shift_value: 0.0
      number_of_points: 120
      inlet:
        extension_type: bspline
        extension_length: 1.5
        axial_tangent: 0.35
        blade_tangent: 0.35
      outlet:
        extension_type: straight
        extension_length: 2.0
        axial_tangent: 0.55
        blade_tangent: 0.15
  mesh:
    show_gui: false
    numerics:
      terminal_output: true
      verbosity: 2
      blade_size: 0.25
      domain_size: 1.0
      curvature_elements: 50
      algorithm: 8
      recombine: true
      recombination_algorithm: 1
      recombine_minimum_quality: 0.1
      smoothing_steps: 5
      inflation_layers:
        enabled: true
        first_height: 0.03
        growth_ratio: 1.2
        thickness: 1.0
      span_layers: 8
      span_stretch: 0.0
    matplotlib:
      num_blades: 3
      annotate_boundaries: true
      mesh_color: orange
      edge_color: black
      domain_color: lightgrey
      dpi: 500
      rasterize_mesh: true
    visualization:
      section_edge_width: 0.35
      volume_edge_width: 0.35
    pyvista:
      show_mesh_edges: true
      surfaces:
        blade: true
        hub: true
        shroud: false
        inlet: false
        outlet: false
        periodic_left: false
        periodic_right: false
    cgns:
      enabled: true
      filename: linear_cascade_3d.cgns
      length_scale: 0.001
      boundary_types:
        blade: BCWallViscous
        inlet: BCInflowSubsonic
        outlet: BCOutflowSubsonic
        periodic_left: BCGeneral
        periodic_right: BCGeneral
        hub: BCWallViscous
        shroud: BCWallViscous
row_id: stator_1
output_dir: output
geometry_figure:
  save: true
  show: false
  size:
  - 14
  - 8
  dpi: 180
  formats:
  - .png
  - .svg
show_gmsh: false
prepare_only: false
run_case: true
reporting:
  level: INFO
  filename: workflow.log
barotropic:
  calculation_type: equilibrium
  efficiency: 1.0
  pressure_ratio: 8.0
  polynomial_degree: 8
  ODE_solver: LSODA
  ODE_tolerance: 1.0e-10
  save_figures: false
fluent:
  product_version: '25.1'
  processor_count: 4
  max_init_attempts: 3
  start_timeout: 90
  ui_mode: no_gui
  case_filename: fluid_domain.cas.h5
  material_name: barotropic_fluid
  turbulence_intensity: 0.05
  turbulence_viscosity_ratio: 10.0
  density_relaxation: 1.0
  turbulence_relaxation: 0.5
  solution_strategy:
  - iterations: 50
    time_scale_factor: 0.05
    order: first
  - iterations: 50
    time_scale_factor: 0.1
    order: first
  - iterations: 50
    time_scale_factor: 0.15
    order: first
  - iterations: 100
    time_scale_factor: 0.2
    order: first
  - iterations: 200
    time_scale_factor: 0.4
    order: first
  - iterations: 300
    time_scale_factor: 0.6
    order: second
  - iterations: 100
    time_scale_factor: 0.8
    order: second
  - iterations: 50
    time_scale_factor: 0.1
    order: second
  high_order_relaxation_factor: 0.5
  residual_equations:
    continuity: 0.0001
    x-velocity: 1.0e-06
    y-velocity: 1.0e-06
    k: 1.0e-06
    omega: 1.0e-06
  residual_figure_dpi: 160
  plot_residuals: true
  print_transcript: true
  pressure_contour:
    enabled: true
    filename: contour_pressure.png
    width: 1600
    height: 1000
  mach_contour:
    enabled: true
    filename: contour_mach.png
    width: 1600
    height: 1000
  periodic_instancing:
    enabled: true
    repeats: 3
  boundaries:
    inlet: inlet
    outlet: outlet
    blade: blade
    periodic_left: periodic_left
    periodic_right: periodic_right
