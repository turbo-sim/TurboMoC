output_dir: output
geometry_figure:
  save: true
  show: false
  size:
  - 14
  - 8
  dpi: 180
  formats:
  - .png
  - .svg
show_gmsh: false
prepare_only: false
run_case: true
reporting:
  level: INFO
  filename: workflow.log
barotropic:
  calculation_type: equilibrium
  efficiency: 1.0
  pressure_ratio: 8.0
  polynomial_degree: 8
  ODE_solver: LSODA
  ODE_tolerance: 1.0e-10
  save_figures: false
fluent:
  product_version: '25.1'
  processor_count: 4
  max_init_attempts: 3
  start_timeout: 90
  ui_mode: no_gui
  case_filename: fluid_domain.cas.h5
  material_name: barotropic_fluid
  turbulence_intensity: 0.05
  turbulence_viscosity_ratio: 10.0
  density_relaxation: 1.0
  turbulence_relaxation: 0.5
  solution_strategy:
  - iterations: 50
    time_scale_factor: 0.05
    order: first
  - iterations: 50
    time_scale_factor: 0.1
    order: first
  - iterations: 50
    time_scale_factor: 0.15
    order: first
  - iterations: 100
    time_scale_factor: 0.2
    order: first
  - iterations: 200
    time_scale_factor: 0.4
    order: first
  - iterations: 300
    time_scale_factor: 0.6
    order: second
  - iterations: 100
    time_scale_factor: 0.8
    order: second
  - iterations: 50
    time_scale_factor: 0.1
    order: second
  high_order_relaxation_factor: 0.5
  residual_equations:
    continuity: 0.0001
    x-velocity: 1.0e-06
    y-velocity: 1.0e-06
    k: 1.0e-06
    omega: 1.0e-06
  residual_figure_dpi: 160
  plot_residuals: true
  print_transcript: true
  pressure_contour:
    enabled: true
    filename: contour_pressure.png
    width: 1600
    height: 1000
  mach_contour:
    enabled: true
    filename: contour_mach.png
    width: 1600
    height: 1000
  periodic_instancing:
    enabled: true
    repeats: 3
  boundaries:
    inlet: inlet
    outlet: outlet
    blade: blade
    periodic_left: periodic_left
    periodic_right: periodic_right
